<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Video Call</title>
<style>
:root{--bg:#0f1724;--card:#182236;--text:#eaf0f7;--muted:#9aa9bc;--accent:#ffb454;--onaccent:#1a1204;--line:#27344d}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,#1d2a44,var(--bg) 70%);color:var(--text);font:16px/1.5 "Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:.55rem .9rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}
button.on{background:#e5484d;border-color:#e5484d;color:#fff}
button:disabled{opacity:.5;cursor:default}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;padding:1.5rem;background:rgba(15,23,36,.82)}
.overlay h1{font-size:clamp(2rem,7vw,3.4rem);margin:0;line-height:1.15}
.overlay p{margin:0;color:var(--muted);max-width:46ch}
.pers{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.pers button{display:flex;flex-direction:column;align-items:center;min-width:8.5rem}
.pers button small{color:var(--muted)}
.pers button.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#call{display:none}
#top{position:fixed;top:0;left:0;right:0;padding:calc(.7rem + env(safe-area-inset-top,0px)) 1rem .7rem;display:flex;justify-content:space-between;align-items:center}
#who{font-weight:600}#status{color:var(--muted);font-size:.85rem}
#panel{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.5rem}
.call-tools{display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap}.call-tools #timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);padding:.35rem .6rem;border:1px solid var(--line);border-radius:999px}.call-tools button{font-size:.86rem;padding:.4rem .65rem}body.avatar-hidden #stage{opacity:.12;transition:opacity .25s}#stage{transition:opacity .25s}
#log{max-height:24vh;overflow-y:auto;display:flex;flex-direction:column;gap:.35rem}
.m{padding:.45rem .75rem;border-radius:12px;background:rgba(24,34,54,.92);border:1px solid var(--line);max-width:88%;font-size:.95rem}
.m.me{align-self:flex-end;background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.row{display:flex;gap:.45rem}
#txt{flex:1;min-width:0;padding:.6rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
#wave{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:.4rem;opacity:.25}
.talk #wave{animation:p .5s infinite alternate}
@keyframes p{to{opacity:1;transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){.talk #wave{animation:none;opacity:1}}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="overlay" id="loader"><p>மாடல் ஏற்றப்படுகிறது… <b id="pct">0%</b></p></div>
<div class="overlay" id="intro" style="display:none">
  <h1 id="hello">உங்களுடன் பேச காத்திருக்கிறார்.</h1>
  <p>துணையைத் தேர்ந்தெடுங்கள். மைக்கில் தமிழிலோ ஆங்கிலத்திலோ பேசுங்கள், அல்லது தட்டச்சு செய்யுங்கள்.</p>
  <div class="pers" id="pers"></div>
  <button class="primary" id="start">அழைப்பைத் தொடங்கு</button>
</div>

<div id="call">
  <div id="top">
    <div><div id="who">மீரா</div><div id="status" aria-live="polite"><span id="wave"></span><span id="st">இணைந்தது</span></div></div>
    <div class="row"><button id="lang">தமிழ்</button><button id="end">முடி</button></div>
  </div>
  <div id="panel">
    <div class="call-tools"><span id="timer">00:00</span><button id="speaker" aria-pressed="true">🔊 Speaker</button><button id="camstyle" aria-pressed="true">✨ Avatar</button></div>
    <div id="log" aria-live="polite"></div>
    <div class="row">
      <button id="mic" class="primary" aria-pressed="false">🎤 பேசு</button>
      <input id="txt" placeholder="இங்கே தட்டச்சு செய்யுங்கள்…" autocomplete="off">
      <button id="send">அனுப்பு</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
var PERSONAS=[
 {id:"meera",name:"மீரா",en:"Meera",tag:"Friend",pitch:1.2},
 {id:"arun",name:"அருண்",en:"Arun",tag:"Mentor",pitch:0.8},
 {id:"priya",name:"பிரியா",en:"Priya",tag:"Language buddy",pitch:1.1}
];
var CFG={name:"மீரா",enName:"Meera",persona:"meera",model:"model.glb",pitch:1.2,ai:"/.netlify/functions/chat"};
var $=function(s){return document.querySelector(s)};
var lang="ta",history=[],speaking=false,listening=false,rec=null,inCall=false;
var callId=null,callStartedAt=null,timerTick=null,speakerOn=true,avatarOn=true;
var sid=(function(){try{var s=localStorage.getItem("sid");if(!s){s=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("sid",s)}return s}catch(e){return "anon"+Date.now().toString(36)}})();

// ---------- Personas
function pick(p){
  CFG.name=p.name;CFG.enName=p.en;CFG.persona=p.id;CFG.pitch=p.pitch;
  $("#who").textContent=p.name;$("#hello").textContent=p.name+" உங்களுடன் பேச காத்திருக்கிறார்.";
  Array.prototype.forEach.call($("#pers").children,function(b){b.classList.toggle("sel",b.dataset.id===p.id)});
}
PERSONAS.forEach(function(p){
  var b=document.createElement("button");b.dataset.id=p.id;
  b.innerHTML="<b></b><small></small>";b.firstChild.textContent=p.name;b.lastChild.textContent=p.tag;
  b.onclick=function(){pick(p)};$("#pers").appendChild(b);
});
pick(PERSONAS[0]);

// ---------- Scene
var renderer=new THREE.WebGLRenderer({canvas:$("#stage"),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(30,1,0.05,30);
scene.add(new THREE.HemisphereLight(0xffffff,0x556688,0.95));
var key=new THREE.DirectionalLight(0xfff0e0,1.3);key.position.set(1.5,2.5,2.5);scene.add(key);
var fill=new THREE.DirectionalLight(0x9db8ff,0.5);fill.position.set(-2,1.5,1.5);scene.add(fill);
var rim=new THREE.DirectionalLight(0xffffff,0.6);rim.position.set(0,2,-3);scene.add(rim);
function resize(){
  var w=innerWidth,h=innerHeight,a=w/h;renderer.setSize(w,h,false);camera.aspect=a;
  var d=a<0.8?2.5:1.75; camera.position.set(0,1.42,d);camera.lookAt(0,1.38,0);camera.updateProjectionMatrix();
}
addEventListener("resize",resize);resize();

// ---------- Model
var root=new THREE.Group(),model=null,mixer=null,clips={},morphs={jaw:[],blink:[],smile:[]},headBone=null,headBase=0;
scene.add(root);
new THREE.GLTFLoader().load(CFG.model,function(g){
  model=g.scene;
  model.traverse(function(o){
    if(o.isMesh){
      var ms=Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(function(m){m.metalness=0;m.metalnessMap=null;m.roughness=Math.max(m.roughness||0.6,0.55);m.needsUpdate=true});
      if(o.morphTargetDictionary){
        Object.keys(o.morphTargetDictionary).forEach(function(k){
          var e={mesh:o,i:o.morphTargetDictionary[k]};
          if(/jawopen|mouthopen|viseme_aa|mouth_open/i.test(k))morphs.jaw.push(e);
          else if(/eyeblink|blink/i.test(k))morphs.blink.push(e);
          else if(/mouthsmile|smile/i.test(k))morphs.smile.push(e);
        });
      }
    }
    if(o.isBone&&/(^|[^a-z])head$/i.test(o.name)&&!headBone){headBone=o;headBase=o.rotation.x}
  });
  var box=new THREE.Box3().setFromObject(model),s=1.68/Math.max(box.getSize(new THREE.Vector3()).y,0.001);
  model.scale.setScalar(s);box.setFromObject(model);var c=box.getCenter(new THREE.Vector3());
  model.position.set(-c.x,-box.min.y,-c.z);root.add(model);
  if(g.animations&&g.animations.length){
    mixer=new THREE.AnimationMixer(model);
    g.animations.forEach(function(a){clips[a.name.toLowerCase()]=mixer.clipAction(a)});
    var idle=clips[Object.keys(clips).filter(function(n){return /idle|stand/.test(n)})[0]]||clips[Object.keys(clips)[0]];
    if(idle)idle.play();
  }
  $("#loader").style.display="none";$("#intro").style.display="flex";
},function(e){if(e.total)$("#pct").textContent=Math.round(e.loaded/e.total*100)+"%"},
function(){$("#loader").innerHTML="<p>model.glb ஏற்ற முடியவில்லை. Netlify-இல் deploy செய்து திறக்கவும் (file:// வேலை செய்யாது).</p>"});

// ---------- Animation
var clock=new THREE.Clock(),nextBlink=2,blinkAt=-1,mouth=0,smile=0,nodT=-1,mouthPulse=0;
function setM(list,v){list.forEach(function(m){m.mesh.morphTargetInfluences[m.i]=v})}
function loop(){
  requestAnimationFrame(loop);var dt=clock.getDelta(),t=clock.elapsedTime;
  if(mixer)mixer.update(dt);
  if(model){
    root.position.y=Math.sin(t*1.5)*0.004;root.rotation.y=Math.sin(t*0.5)*0.05;
    root.rotation.x=speaking?Math.sin(t*5)*0.006:0;
    var tgt=speaking?(0.25+Math.abs(Math.sin(t*13))*0.5*(0.6+0.4*Math.sin(t*3.1))):0;
    mouth+=(tgt-mouth)*0.35;setM(morphs.jaw,mouth);
    smile+=((speaking?0.5:0.15)-smile)*0.08;setM(morphs.smile,smile);
    if(t>nextBlink&&blinkAt<0){blinkAt=t;nextBlink=t+2.5+Math.random()*3}
    var b=0;if(blinkAt>=0){var k=(t-blinkAt)/0.16;b=k<1?Math.sin(k*Math.PI):0;if(k>=1)blinkAt=-1}
    setM(morphs.blink,b);
    if(headBone)headBone.rotation.x=headBase+(speaking?Math.sin(t*4)*0.03:0)+(nodT>=0?Math.sin((t-nodT)*8)*0.15:0);
    if(nodT>=0&&t-nodT>1.2)nodT=-1;
  }
  renderer.render(scene,camera);
}
loop();
function wave(){var c=clips.wave||clips.waving||clips[Object.keys(clips).filter(function(n){return /wave/.test(n)})[0]];if(c){c.reset().setLoop(THREE.LoopOnce).play();}}

// ---------- Speech out
var voices=[];function lv(){voices=speechSynthesis.getVoices()}
if("speechSynthesis" in window){lv();speechSynthesis.onvoiceschanged=lv}
function st(s){$("#st").textContent=s}
function addMsg(t,me){var d=document.createElement("div");d.className="m"+(me?" me":"");d.textContent=t;var l=$("#log");l.appendChild(d);l.scrollTop=l.scrollHeight}
function setSpeaking(v){speaking=v;document.body.classList.toggle("talk",v)}
function say(text){
  addMsg(text,false);history.push({role:"assistant",content:text});
  if(!("speechSynthesis" in window)){return}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text),code=lang==="ta"?"ta":"en";
  u.lang=lang==="ta"?"ta-IN":"en-US";u.pitch=CFG.pitch;
  var v=voices.find(function(x){return x.lang.toLowerCase().indexOf(code)===0});if(v)u.voice=v;
  else if(lang==="ta")st("இந்த சாதனத்தில் தமிழ் குரல் இல்லை; எழுத்தில் பதில் வரும்");
  u.onstart=function(){setSpeaking(true);st("பேசுகிறார்…")};\n  u.onboundary=function(){mouthPulse=1};
  u.onend=u.onerror=function(){setSpeaking(false);st("கேட்கத் தயார்")};
  if(speakerOn)speechSynthesis.speak(u);
}

// ---------- Replies (AI first, simple fallback)
var FB={
 ta:{greet:"வணக்கம்! உங்களைப் பார்த்ததில் மகிழ்ச்சி. எப்படி இருக்கீங்க?",how:"நான் நல்லா இருக்கேன். நீங்க எப்படி?",bye:"சரி, மீண்டும் சந்திப்போம்!",other:["சுவாரஸ்யமா இருக்கு, இன்னும் சொல்லுங்க.","ஓ அப்படியா? அப்புறம் என்ன ஆச்சு?","நான் கவனிக்கிறேன், தொடருங்க."]},
 en:{greet:"Hello! So nice to see you. How are you?",how:"I’m doing great. How about you?",bye:"See you again soon!",other:["That sounds interesting, tell me more.","Oh really? What happened next?","I’m listening, go on."]}
};
function local(q){
  var x=q.toLowerCase(),d=FB[lang];
  if(/your name|peyar|பெயர்/.test(x))return lang==="ta"?"என் பெயர் "+CFG.name+".":"My name is "+CFG.enName+".";
  if(/how are you|eppadi|எப்படி/.test(x))return d.how;
  if(/\b(hi|hello|hey|vanakkam)\b|வணக்கம்/.test(x)){wave();return d.greet}
  if(/\bbye\b|பாய்/.test(x))return d.bye;
  return d.other[Math.floor(Math.random()*d.other.length)];
}
async function reply(q){
  try{
    var r=await fetch(CFG.ai,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q,history:history.slice(-10),persona:CFG.persona,session:sid})});
    if(r.ok){var d=await r.json();if(d&&d.reply)return d.reply}
  }catch(e){}
  return local(q);
}
async function handle(text){
  text=(text||"").trim();if(!text||!inCall)return;
  addMsg(text,true);history.push({role:"user",content:text});st("யோசிக்கிறார்…");
  say(await reply(text));
}

// ---------- Mic
$("#mic").onclick=function(){
  var btn=this;if(listening){rec&&rec.stop();return}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){st("இந்த browser-இல் மைக் வசதி இல்லை; தட்டச்சு செய்யுங்கள்");return}
  rec=new SR();rec.lang=lang==="ta"?"ta-IN":"en-US";rec.interimResults=false;
  rec.onresult=function(e){handle(e.results[0][0].transcript)};
  rec.onend=function(){listening=false;btn.classList.remove("on");btn.setAttribute("aria-pressed","false")};
  rec.onerror=function(e){st(e.error==="not-allowed"?"மைக் அனுமதி தேவை":"மைக் பிழை: "+e.error)};
  if("speechSynthesis" in window)speechSynthesis.cancel();
  try{rec.start();listening=true;btn.classList.add("on");btn.setAttribute("aria-pressed","true");st("கேட்கிறேன்…")}catch(e){}
};
$("#send").onclick=function(){var v=$("#txt").value;$("#txt").value="";handle(v)};
$("#txt").onkeydown=function(e){if(e.key==="Enter")$("#send").click()};
$("#lang").onclick=function(){lang=lang==="ta"?"en":"ta";this.textContent=lang==="ta"?"தமிழ்":"English"};
function updateCallTimer(reset){var el=$("#timer");if(!el)return;if(reset||!callStartedAt){el.textContent="00:00";return}var sec=Math.max(0,Math.floor((Date.now()-callStartedAt)/1000));el.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}
$("#speaker").onclick=function(){speakerOn=!speakerOn;this.setAttribute("aria-pressed",String(speakerOn));this.textContent=speakerOn?"🔊 Speaker":"🔇 Muted";if(speakerOn){speechSynthesis.resume()}else{speechSynthesis.pause()}};
$("#camstyle").onclick=function(){avatarOn=!avatarOn;this.setAttribute("aria-pressed",String(avatarOn));this.textContent=avatarOn?"✨ Avatar":"🌙 Hide Avatar";document.body.classList.toggle("avatar-hidden",!avatarOn)};


// ---------- Call flow
$("#start").onclick=async function(){
  $("#intro").style.display="none";$("#call").style.display="block";inCall=true;history=[];$("#log").innerHTML="";
  callStartedAt=Date.now();updateCallTimer();timerTick=setInterval(updateCallTimer,1000);
  callId=null;try{var cs=await fetch(CFG.ai,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"call_start",session:sid,persona:CFG.persona})});if(cs.ok){var cd=await cs.json();callId=cd.call_id||null}}catch(e){}
  wave();nodT=clock.elapsedTime;
  try{
    var r=await fetch(CFG.ai+"?session="+encodeURIComponent(sid)+"&persona="+CFG.persona);
    if(r.ok){var d=await r.json();(d.messages||[]).forEach(function(m){addMsg(m.content,m.role==="user");history.push({role:m.role,content:m.content})})}
  }catch(e){}
  say(lang==="ta"?(history.length?"மீண்டும் வருக! தொடரலாமா?":"வணக்கம்! நான் "+CFG.name+". பேசலாமா?"):(history.length?"Welcome back! Shall we continue?":"Hi! I’m "+CFG.enName+". Shall we talk?"));
};
$("#end").onclick=function(){
  if("speechSynthesis" in window)speechSynthesis.cancel();rec&&rec.abort&&rec.abort();setSpeaking(false);
  if(timerTick){clearInterval(timerTick);timerTick=null}updateCallTimer(true);
  if(callId){fetch(CFG.ai,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"call_end",session:sid,persona:CFG.persona,call_id:callId})}).catch(function(){});callId=null}
  inCall=false;$("#call").style.display="none";$("#intro").style.display="flex";
};
</script>
</body>
</html>
